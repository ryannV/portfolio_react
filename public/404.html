<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Redirecionando...</title>
  <script type="text/javascript">
    // SPA GitHub Pages Redirect Script (Solução oficial para BrowserRouter no GitHub Pages)
    // Redireciona requisições de rotas diretas para a raiz preservando rota, query e hash.
    var pathSegmentsToKeep = 1; // Para /portfolio_react/ o segmento mantido é 1
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
