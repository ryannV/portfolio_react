  <!-- Roteamento SPA GitHub Pages: restaura rota limpa sem '#' após redirecionamento do 404.html e migra links legados '#/' -->
  <script type="text/javascript">
    (function(l) {
      if (l.hash && l.hash.indexOf('#/') === 0) {
        var cleanPath = l.pathname.replace(/\/$/, '') + '/' + l.hash.slice(2);
        window.history.replaceState(null, null, cleanPath);
      }
      if (l.search && l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
